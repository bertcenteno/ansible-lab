---
- name: Update package cache on Ubuntu
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == "Debian"

- name: Update package cache on Rocky
  ansible.builtin.dnf:
    update_cache: true
  when: ansible_facts['os_family'] == "RedHat"

- name: Install EPEL repository
  ansible.builtin.dnf:
    name: epel-release
    state: present
  when: ansible_facts['os_family'] == "RedHat"

- name: Refresh package cache after installing EPEL
  ansible.builtin.dnf:
    update_cache: true
  when: ansible_facts['os_family'] == "RedHat"

- name: Install common packages
  ansible.builtin.package:
    name: "{{ common_packages }}"
    state: present

