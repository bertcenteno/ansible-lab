---
- name: Create compose project directories
  ansible.builtin.file:
    path: "{{ docker_compose_base_dir }}/{{ item.name }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ docker_compose_projects }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create known-good backup directory
  ansible.builtin.file:
    path: "{{ docker_compose_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Check known-good compose files
  ansible.builtin.stat:
    path: "{{ docker_compose_backup_dir }}/{{ item.name }}/docker-compose.yml"
  register: docker_compose_known_good_files
  loop: "{{ docker_compose_projects }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create known-good project directories
  ansible.builtin.file:
    path: "{{ docker_compose_backup_dir }}/{{ item.name }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: "{{ docker_compose_projects }}"
  loop_control:
    label: "{{ item.name }}"

- name: Bootstrap known-good compose files
  ansible.builtin.copy:
    src: "{{ docker_compose_base_dir }}/{{ item.item.name }}/docker-compose.yml"
    dest: "{{ docker_compose_backup_dir }}/{{ item.item.name }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0600"
    remote_src: true
  when: not item.stat.exists
  loop: "{{ docker_compose_known_good_files.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Deploy and verify Docker Compose applications
  block:
    - name: Deploy docker-compose.yml files
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ docker_compose_base_dir }}/{{ item.name }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ docker_compose_projects }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Start compose projects
      community.docker.docker_compose_v2:
        project_src: "{{ docker_compose_base_dir }}/{{ item.name }}"
        state: "{{ docker_compose_state }}"
      loop: "{{ docker_compose_projects }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Get Docker Compose service status
      ansible.builtin.command:
        cmd: docker compose ps --format json
        chdir: "{{ docker_compose_base_dir }}/{{ item }}"
      check_mode: false  
      register: docker_compose_service_status
      changed_when: false
      retries: 12
      delay: 5
      until:
        - (docker_compose_service_status.stdout | from_json).State == "running"
        - (docker_compose_service_status.stdout | from_json).Health == "healthy"
      loop:
        - nginx
        - mariadb

    - name: Verify Docker Compose services are running and healthy
      ansible.builtin.assert:
        that:
          - (item.stdout | from_json).State == "running"
          - (item.stdout | from_json).Health == "healthy"
        fail_msg: >-
          Docker Compose project {{ item.item }} failed health verification.
          State={{ (item.stdout | from_json).State }},
          Health={{ (item.stdout | from_json).Health }}
        success_msg: >-
          Docker Compose project {{ item.item }} is running and healthy.
      loop: "{{ docker_compose_service_status.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Verify nginx HTTP response
      ansible.builtin.uri:
        url: http://localhost:8080
        method: GET
        status_code: 200
      check_mode: false  
      register: docker_compose_nginx_http_check
      retries: 5
      delay: 5
      until: docker_compose_nginx_http_check.status == 200

    - name: Promote verified compose files to known-good
      ansible.builtin.copy:
        src: "{{ docker_compose_base_dir }}/{{ item.name }}/docker-compose.yml"
        dest: "{{ docker_compose_backup_dir }}/{{ item.name }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0600"
        remote_src: true
      loop: "{{ docker_compose_projects }}"
      loop_control:
        label: "{{ item.name }}"
  rescue:
    - name: Report deployment failure and start rollback
      ansible.builtin.debug:
        msg: >-
          Deployment verification failed.
          Restoring the last known-good Docker Compose configuration.

    - name: Restore known-good compose files
      ansible.builtin.copy:
        src: "{{ docker_compose_backup_dir }}/{{ item.name }}/docker-compose.yml"
        dest: "{{ docker_compose_base_dir }}/{{ item.name }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0644"
        remote_src: true
      loop: "{{ docker_compose_projects }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Redeploy known-good compose projects
      community.docker.docker_compose_v2:
        project_src: "{{ docker_compose_base_dir }}/{{ item.name }}"
        state: "{{ docker_compose_state }}"
      loop: "{{ docker_compose_projects }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Verify rollback Docker Compose service status
      ansible.builtin.command:
        cmd: docker compose ps --format json
        chdir: "{{ docker_compose_base_dir }}/{{ item }}"
      register: docker_compose_rollback_service_status
      changed_when: false
      retries: 12
      delay: 5
      until:
        - (docker_compose_rollback_service_status.stdout | from_json).State == "running"
        - (docker_compose_rollback_service_status.stdout | from_json).Health == "healthy"
      loop:
        - nginx
        - mariadb

    - name: Verify nginx HTTP response after rollback
      ansible.builtin.uri:
        url: http://localhost:8080
        method: GET
        status_code: 200
      register: docker_compose_rollback_nginx_http_check
      retries: 5
      delay: 5
      until: docker_compose_rollback_nginx_http_check.status == 200

    - name: Report successful rollback
      ansible.builtin.debug:
        msg: >-
          Rollback completed successfully.
          The last known-good Docker Compose configuration has been restored.

    - name: Record successful rollback status
      ansible.builtin.copy:
        content: "SUCCESS\n"
        dest: /home/ansible/.ansible-rollback-status
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Fail deployment after successful rollback
      ansible.builtin.fail:
        msg: >-
          Deployment failed and automatic rollback completed successfully.
          The last known-good Docker Compose configuration is running.
