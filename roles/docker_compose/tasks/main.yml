---
- name: Create compose project directories
  ansible.builtin.file:
    path: "{{ docker_compose_base_dir }}/{{ item.name }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ docker_compose_projects }}"
  loop_control:
    label: "{{ item.name }}"

- name: Deploy docker-compose.yml files
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ docker_compose_base_dir }}/{{ item.name }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ docker_compose_projects }}"
  loop_control:
    label: "{{ item.name }}"

- name: Start compose projects
  community.docker.docker_compose_v2:
    project_src: "{{ docker_compose_base_dir }}/{{ item.name }}"
    state: "{{ docker_compose_state }}"
  loop: "{{ docker_compose_projects }}"
  loop_control:
    label: "{{ item.name }}"

- name: Verify nginx HTTP response
  ansible.builtin.uri:
    url: http://localhost:8080
    method: GET
    status_code: 200
  register: nginx_http_check
  retries: 5
  delay: 5
  until: nginx_http_check.status == 200
