---
docker_compose_nginx_image: "nginx:v2.2-rollback-test-invalid"
docker_compose_mariadb_image: "mariadb:12.3.2"
docker_compose_portainer_image: "portainer/portainer-ce:2.39.5"

docker_compose_base_dir: /opt/compose
docker_compose_backup_dir: /opt/compose/.known-good
docker_compose_state: present
docker_compose_projects:
  - name: nginx
    services:
      nginx:
        image: "{{ docker_compose_nginx_image }}"
        restart: unless-stopped
        ports:
          - "8080:80"

        healthcheck:
          test:
            - CMD
            - curl
            - "-f"
            - http://localhost

          interval: 30s
          timeout: 10s
          retries: 3

        environment: {}
        volumes: []
        networks: []
        command: ""

  - name: portainer
    services:
      portainer:
        image: "{{ docker_compose_portainer_image }}"
        restart: unless-stopped
        ports:
          - "9000:9000"
        environment: {}
        volumes:
          - "/var/run/docker.sock:/var/run/docker.sock"
          - "portainer_data:/data"
        networks: []
        command: ""
    volumes:
      portainer_data: {}

  - name: mariadb

    volumes:
      mysql_data: {}
    services:
      mariadb:
        image: "{{ docker_compose_mariadb_image }}"

        restart: unless-stopped

        environment:
          MYSQL_DATABASE: "{{ mariadb_database }}"
          MYSQL_USER: "{{ mariadb_user }}"
          MYSQL_PASSWORD: "{{ vault_mariadb_password }}"
          MYSQL_ROOT_PASSWORD: "{{ vault_mariadb_root_password }}"

        volumes:
          - "mysql_data:/var/lib/mysql"

        healthcheck:
          test:
            - CMD
            - healthcheck.sh
            - "--connect"
            - "--innodb_initialized"

          interval: 30s
          timeout: 10s
          retries: 5

        networks: []
        command: ""
