---
- name: Configure all Linux servers
  hosts: all
  become: true

  roles:
    - role: common
      tags:
        - common

    - role: users
      tags:
        - users

    - role: chrony
      tags:
        - chrony

- name: Configure Web Servers
  hosts: webservers
  become: true

  roles:
    - role: apache
      tags:
        - apache

- name: Configure Database Servers
  hosts: dbservers
  become: true

  roles:
    - role: mariadb
      tags:
        - mariadb
